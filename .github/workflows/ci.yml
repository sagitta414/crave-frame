name: Validate Crave Frame
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tv/package-lock.json
      - run: npm run setup
      - run: npm run check:secrets
      - run: npm test
      - run: npm run build
