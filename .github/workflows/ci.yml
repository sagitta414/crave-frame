name: Validate Crave Frame
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tv/package-lock.json
            aws/package-lock.json
      - run: npm run setup
      - run: npm run check:secrets
      - run: npm run check:secrets:history
      - run: npm test
      - run: npm run build
      - run: npm ci
        working-directory: aws
      - run: npm run build
        working-directory: aws
      - run: npm run synth
        working-directory: aws
      - run: npm test
        working-directory: aws
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install boto3==1.43.118
      - run: python -m unittest discover -s aws/tests -p 'test_*.py' -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm --prefix web audit --audit-level=high
      - name: Install TV dependencies and apply verified security patches
        run: npm --prefix tv ci
        if: always()
      - name: Audit TV dependencies with tested, expiring mitigations
        run: npm run check:security:tv
        if: always()
      - run: npm --prefix aws audit --audit-level=high
        if: always()
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
