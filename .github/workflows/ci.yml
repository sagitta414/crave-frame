name: Validate Crave Frame
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tv/package-lock.json
            aws/package-lock.json
      - run: npm run setup
      - run: npm run check:secrets
      - run: npm test
      - run: npm run build
      - run: npm ci
        working-directory: aws
      - run: npm run build
        working-directory: aws
      - run: npm run synth
        working-directory: aws
      - run: npm test
        working-directory: aws

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm --prefix web audit --audit-level=high
      - run: npm --prefix tv audit --audit-level=high
        if: always()
      - run: npm --prefix aws audit --audit-level=high
        if: always()
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
